<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Casa da Palavra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* Conceito: uma biblioteca encadernada. Lombadas na estante, capas de tecido com título dourado, abas de índice de Bíblia e sumários com pontilhado. */
:root {
  --paper: #F4F6F2; --sheet: #FFFFFF; --ink: #1B2A24; --muted: #56665F; --line: #D6DCD5;
  --leather: #14352C; --leather-deep: #0D261F; --gold: #D9B568; --on-leather: #F2EEE1; --on-leather-soft: #BFCAC0;
  --action: #14352C; --on-action: #F8F6EE; --rubric: #A32A2A; --ok: #1B7347; --ok-bg: #E2F2E9;
  --note-bg: #F3E9CF; --note-ink: #4A3A12; --tab: #E4E8E1; --qr-bg: #FFFFFF; --qr-ink: #14211C; --shadow: rgba(13, 38, 31, .22);
  --c1: #1F4D3F; --c2: #6B1F2A; --c3: #1E3557; --c4: #4B2A55; --c5: #6A4A1E; --c6: #36474F;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --caps: "Alegreya SC", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1714; --sheet: #17221E; --ink: #E8ECE6; --muted: #A1AEA7; --line: #2C3A34;
  --leather: #12302A; --leather-deep: #0A1F19; --action: #D9B568; --on-action: #14201B; --rubric: #EFA096; --ok: #7BD3A4; --ok-bg: #16332A;
  --note-bg: #2B2513; --note-ink: #EBDCB0; --tab: #202D28; --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0F1714; --sheet: #17221E; --ink: #E8ECE6; --muted: #A1AEA7; --line: #2C3A34;
  --leather: #12302A; --leather-deep: #0A1F19; --action: #D9B568; --on-action: #14201B; --rubric: #EFA096; --ok: #7BD3A4; --ok-bg: #16332A;
  --note-bg: #2B2513; --note-ink: #EBDCB0; --tab: #202D28; --shadow: rgba(0, 0, 0, .5); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--leather-deep); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; }
h2 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); }
h3 { font-size: 1.2rem; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1120px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.eyebrow { font: 500 .95rem/1.2 var(--caps); letter-spacing: .06em; color: var(--rubric); }
.muted { color: var(--muted); }
.stack { display: grid; gap: 14px; }

/* Faixa do protótipo */
.proto { background: var(--note-bg); color: var(--note-ink); font-size: .92rem; }
.proto .wrap { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; justify-content: space-between; padding-block: 7px; }
.proto-links { display: flex; gap: 16px; flex-wrap: wrap; }
.linklike { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }

/* Cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--leather-deep); color: var(--on-leather); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; }
.brand { display: grid; text-decoration: none; line-height: 1.1; }
.brand b { font: 700 1.3rem/1.1 var(--caps); letter-spacing: .03em; color: var(--gold); }
.brand small { font-size: .8rem; color: var(--on-leather-soft); }
.top nav { display: flex; align-items: center; gap: clamp(10px, 3vw, 24px); }
.top nav a { text-decoration: none; font-weight: 500; }
.top nav a:hover { color: var(--gold); }
.nav-opt { display: inline; }
.pill-link { border: 1px solid var(--gold); border-radius: 3px; padding: 6px 12px; color: var(--gold); white-space: nowrap; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 3px; padding: 13px 22px; background: var(--action); color: var(--on-action); font-weight: 700; text-decoration: none; transition: filter .15s; }
.btn:hover { filter: brightness(1.15); }
.btn.gold { background: var(--gold); color: #1B241F; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .65; cursor: progress; }

/* Abertura com a estante */
.hero { background: radial-gradient(90% 120% at 85% 0%, var(--leather) 0%, var(--leather-deep) 75%); color: var(--on-leather); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: end; padding-top: clamp(36px, 7vw, 76px); }
.hero-text { display: grid; gap: 20px; padding-bottom: clamp(32px, 6vw, 72px); justify-items: start; min-width: 0; }
.hero h1 { font-size: clamp(2.5rem, 6vw, 4.2rem); line-height: 1.02; }
.hero h1 em { color: var(--gold); font-style: italic; font-weight: 500; }
.hero-lead { max-width: 46ch; font-size: 1.16rem; color: var(--on-leather-soft); }
.verse { font: italic 500 1.05rem/1.35 var(--display); color: var(--on-leather); border-left: 2px solid var(--gold); padding-left: 12px; }
.verse span { display: block; font: 500 .85rem var(--caps); letter-spacing: .05em; color: var(--gold); margin-top: 2px; }
.shelf { display: flex; align-items: flex-end; gap: 3px; height: 400px; border-bottom: 12px solid #2B1C10; min-width: 0; }
.spine { position: relative; flex: 1 1 0; min-width: 0; height: var(--h); background: linear-gradient(90deg, rgba(0,0,0,.34), rgba(255,255,255,.1) 28%, rgba(255,255,255,.03) 62%, rgba(0,0,0,.3)), var(--cloth); border: 0; border-radius: 3px 3px 0 0; color: var(--gold); padding: 34px 0; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform .25s ease; }
.spine::before, .spine::after { content: ""; position: absolute; left: 0; right: 0; height: 7px; border-block: 1px solid var(--gold); }
.spine::before { top: 16px; } .spine::after { bottom: 16px; }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font: 500 clamp(.82rem, 1.5vw, 1.05rem)/1.1 var(--caps); letter-spacing: .05em; max-height: 100%; overflow: hidden; white-space: nowrap; }
.spine:hover, .spine:focus-visible { transform: translateY(-16px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .spine, .btn { transition: none; } .spine:hover, .spine:focus-visible { transform: none; } }

/* Seções */
.section { padding-block: clamp(44px, 7vw, 84px); scroll-margin-top: 40px; }
.section-head { display: grid; gap: 6px; margin-bottom: 26px; max-width: 62ch; }

/* Catálogo com abas de índice */
.index { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: start; }
.index-page { background: var(--sheet); border: 1px solid var(--line); border-right-width: 3px; padding: clamp(16px, 3vw, 32px); min-width: 0; min-height: 560px; }
.tabs { display: flex; flex-direction: column; gap: 4px; padding-top: 22px; }
.tab { writing-mode: vertical-rl; background: var(--tab); border: 1px solid var(--line); border-left: 0; border-radius: 0 7px 7px 0; padding: 14px 8px; font: 500 1rem/1 var(--caps); letter-spacing: .05em; color: var(--muted); }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--leather); color: var(--gold); border-color: var(--leather); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 3vw, 34px); }
.card { display: grid; gap: 10px; align-content: start; text-decoration: none; min-width: 0; }
.cover { position: relative; aspect-ratio: 3 / 4; max-width: 100%; background: linear-gradient(90deg, rgba(0,0,0,.32) 0, rgba(0,0,0,.05) 5%, rgba(255,255,255,.07) 7%, rgba(0,0,0,0) 14%), var(--cloth); color: var(--gold); border-radius: 2px 5px 5px 2px; box-shadow: 0 10px 22px var(--shadow); transition: transform .2s ease; display: grid; grid-template-rows: auto 1fr auto; text-align: center; padding: clamp(14px, 3vw, 24px) clamp(14px, 2.4vw, 22px) clamp(14px, 3vw, 24px) clamp(18px, 3vw, 28px); container-type: inline-size; }
.cover::after { content: ""; position: absolute; inset: 8px 8px 8px 14px; border: 1px solid currentColor; opacity: .75; pointer-events: none; }
.cover small { font: 500 clamp(.68rem, 6.4cqw, .92rem)/1.1 var(--caps); letter-spacing: .08em; }
.cover strong { align-self: center; font: 700 clamp(.98rem, 11cqw, 1.7rem)/1.14 var(--display); overflow-wrap: anywhere; hyphens: auto; }
.cover i { font: italic 500 clamp(.68rem, 6cqw, .9rem)/1.1 var(--display); }
.card:hover .cover { transform: translateY(-4px); }
.card-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; justify-content: space-between; align-items: baseline; }
.card-title { font: 700 1.05rem/1.2 var(--display); }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Como funciona */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 4vw, 44px); margin: 0; padding: 0; list-style: none; counter-reset: passo; }
.steps li { counter-increment: passo; display: grid; gap: 8px; align-content: start; border-top: 2px solid var(--ink); padding-top: 12px; }
.steps li::before { content: "Passo " counter(passo); font: 500 .95rem var(--caps); letter-spacing: .05em; color: var(--rubric); }

/* Professor */
.band { background: var(--sheet); border-block: 1px solid var(--line); }
.teacher { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: clamp(22px, 5vw, 56px); align-items: center; }
.slot { border: 1.5px dashed var(--muted); border-radius: 3px; color: var(--muted); display: grid; place-items: center; text-align: center; padding: 18px; font-size: .96rem; }
.teacher-photo { display: block; width: 100%; height: auto; border-radius: 3px; box-shadow: 0 12px 28px var(--shadow); }
.demo-tag { justify-self: start; font-size: .92rem; font-weight: 500; color: var(--note-ink); background: var(--note-bg); padding: 2px 10px; border-radius: 3px; width: fit-content; }
.creds { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.quotes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 4vw, 44px); }
.quotes figure { margin: 0; display: grid; gap: 10px; align-content: start; border-top: 2px solid var(--gold); padding-top: 14px; }
.quotes blockquote { margin: 0; font: italic 500 1.16rem/1.4 var(--display); }
.quotes figcaption { color: var(--muted); font-size: .95rem; }
/* Perguntas */
.faq { display: grid; max-width: 760px; }
.faq details { border-bottom: 1px solid var(--line); padding-block: 14px; }
.faq summary { cursor: pointer; font: 700 1.12rem/1.3 var(--display); }
.faq p { margin-top: 8px; color: var(--muted); max-width: 65ch; }

.foot { background: var(--leather-deep); color: var(--on-leather-soft); padding-block: 30px; font-size: .95rem; }
.foot .wrap { display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: space-between; }

/* Página do curso */
.crumb { font-size: .95rem; margin-bottom: 20px; display: inline-block; }
.course { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: clamp(24px, 5vw, 60px); align-items: start; }
.course-side { display: grid; gap: 18px; position: sticky; top: 84px; }
.course h1 { font-size: clamp(2rem, 4.6vw, 3rem); }
.buy { background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 18px; display: grid; gap: 10px; }
.buy .amount { font: 700 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; padding-block: 12px; border-block: 1px solid var(--line); }
.facts div { min-width: 0; }
.facts dt { font: 500 .85rem var(--caps); letter-spacing: .05em; color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.toc li { display: flex; align-items: baseline; gap: 8px; }
.toc .cap { color: var(--rubric); font: 500 .95rem var(--caps); flex: none; min-width: 2.4em; }
.toc .dots { flex: 1; border-bottom: 1.5px dotted var(--muted); min-width: 16px; transform: translateY(-4px); }
.toc .pg { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Entrar e pagar */
.narrow { max-width: 460px; margin-inline: auto; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: clamp(18px, 3.5vw, 30px); display: grid; gap: 16px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 500; font-size: .95rem; }
.field input { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--muted); width: 100%; }
.progress { display: flex; flex-wrap: wrap; gap: 6px 10px; list-style: none; margin: 0 0 22px; padding: 0; font-size: .96rem; color: var(--muted); }
.progress li + li::before { content: "›"; margin-right: 10px; }
.progress .now { color: var(--ink); font-weight: 700; }
.progress .done { color: var(--ok); }
.pay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: clamp(18px, 3vw, 28px); align-items: start; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--action); color: var(--on-action); font-weight: 700; }
.pix { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center; }
.qr { background: var(--qr-bg); color: var(--qr-ink); padding: 10px; border: 1px solid var(--line); border-radius: 3px; width: 170px; }
.qr svg { display: block; width: 100%; height: auto; }
.status { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: .95rem; padding: 3px 10px; border-radius: 99px; background: var(--note-bg); color: var(--note-ink); justify-self: start; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.paid { background: var(--ok-bg); color: var(--ok); }
.line { display: flex; justify-content: space-between; gap: 12px; }
.line.total { border-top: 1px solid var(--line); padding-top: 10px; font-weight: 700; font-size: 1.15rem; }

/* Biblioteca */
.lib { display: grid; gap: 14px; }
.lib-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 12px 16px 12px 12px; }
.lib-row.fresh { box-shadow: 0 0 0 2px var(--ok); }
.mini { height: 86px; background: var(--cloth); border-radius: 1px 3px 3px 1px; color: var(--gold); display: grid; place-items: center; font: 700 1.3rem var(--caps); }
.empty { text-align: center; }

/* Prévia do PDF */
dialog { border: 0; padding: 0; background: var(--paper); color: var(--ink); width: min(620px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 4px; }
dialog::backdrop { background: rgba(5, 15, 12, .7); }
.dlg { display: grid; gap: 14px; padding: 16px; }
.dlg-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pdf { position: relative; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); padding: 28px clamp(18px, 5vw, 40px); display: grid; gap: 12px; }
.pdf h3 { font-size: 1.5rem; }
.pdf p { position: relative; }
.marks { position: absolute; inset: -40% -40%; display: grid; gap: 62px; align-content: center; transform: rotate(-28deg); pointer-events: none; color: var(--rubric); opacity: .2; font-weight: 700; white-space: nowrap; font-size: 1.05rem; text-align: center; }
.pdf-foot { border-top: 1px solid var(--line); padding-top: 8px; font-size: .86rem; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }

/* Painel */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; min-width: 0; }
.stat b { display: block; font: 700 clamp(1.4rem, 3vw, 1.95rem)/1.1 var(--display); font-variant-numeric: tabular-nums; }
.dash { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start; margin-top: 18px; }
.table-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .98rem; min-width: 440px; }
th { text-align: left; font: 500 .88rem var(--caps); letter-spacing: .05em; color: var(--muted); }
th, td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
.tag { font-size: .84rem; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
tr.fresh td { font-weight: 700; }
.panel-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.rank { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.rank li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(460px, calc(100vw - 32px)); background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 3px; font-weight: 500; }

@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .hero-text { padding-bottom: 20px; }
  .shelf { height: 300px; }
  .spine { padding: 20px 0; }
  .spine::before { top: 8px; } .spine::after { bottom: 8px; }
  .spine span { font-size: .72rem; }
  .course, .pay, .dash, .teacher { grid-template-columns: minmax(0, 1fr); }
  .course-side { position: static; grid-template-columns: 120px minmax(0, 1fr); align-items: start; }
  .quotes { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .nav-opt { display: none; }
  .index { grid-template-columns: minmax(0, 1fr); }
  .tabs { flex-direction: row; padding-top: 0; order: -1; }
  .tab { writing-mode: horizontal-tb; flex: 1; border: 1px solid var(--line); border-bottom: 0; border-radius: 7px 7px 0 0; padding: 10px 2px; font-size: .86rem; letter-spacing: 0; min-width: 0; }
  .index-page { border-right-width: 1px; min-height: 0; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .pix { grid-template-columns: minmax(0, 1fr); justify-items: start; }
  .lib-row { grid-template-columns: 52px minmax(0, 1fr); }
  .lib-row .btn { grid-column: 1 / -1; }
  .mini { height: 70px; }
  .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div id="proto" class="proto"></div>
<header id="top" class="top"></header>
<main id="app"></main>
<footer id="foot" class="foot"></footer>
<dialog id="pdf" aria-label="Prévia da apostila"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const BRAND = 'Casa da Palavra';const STUDENT = { name: 'Maria Exemplo', email: 'maria.exemplo@exemplo.com', cpf: '***.456.789-**' };
const CATS = ['Todos', 'Bíblia', 'Doutrina', 'Ministério'];
const COURSES = [
  { id: 'at', short: 'Antigo Testamento', title: 'Panorama do Antigo Testamento', cat: 'Bíblia', pages: 184, price: 97, cloth: 'var(--c1)', h: '100%', mono: 'AT',
    about: 'Da Criação aos profetas: o fio da história de Israel, livro por livro, com contexto, temas centrais e mapas de leitura.',
    toc: [['A Lei e as origens', 7], ['Os livros históricos', 48], ['Poesia e sabedoria', 92], ['Os profetas maiores', 124], ['Os profetas menores', 158]] },

function qrSVG(seed) {
  const n = 25; let r = seed * 9301 + 49297, cells = '';
  const finder = (x, y) => x < 7 && y < 7 ? (x === 0 || x === 6 || y === 0 || y === 6 || (x > 1 && x < 5 && y > 1 && y < 5)) : null;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    r = (r * 9301 + 49297) % 233280;
    const f = finder(x, y) ?? finder(n - 1 - x, y) ?? finder(x, n - 1 - y);
    const inQuiet = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (f === true || (f === null && !inQuiet && r / 233280 > .5)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" fill="currentColor" role="img" aria-label="Código Pix de exemplo, sem validade">${cells}</svg>`;
}

function render(scrollTo) {
  shell();
  const t = current;
  let html;
  if (t.startsWith('c-') && byId(t.slice(2))) html = viewCourse(byId(t.slice(2)));
  else if (t.startsWith('pagar-') && byId(t.slice(6))) {
    const id = t.slice(6);
    if (!state.user) { state.pendingCourse = id; save(); current = 'entrar'; html = viewLogin(); }
    else if (state.owned.includes(id)) { current = 'biblioteca'; html = viewLibrary(); }
    else html = viewPay(byId(id));
  }
  else if (t === 'entrar') html = state.user ? viewLibrary() : viewLogin();
  else if (t === 'biblioteca') { if (state.user) html = viewLibrary(); else { current = 'entrar'; html = viewLogin(); } }
  else if (t === 'painel') html = viewPanel();
  else html = viewHome();
  $('app').innerHTML = html;
  shell();
  const target = scrollTo && $(scrollTo);
  if (target) target.scrollIntoView(); else if (scrollTo !== false) window.scrollTo({ top: 0, behavior: 'auto' });
}

let current = 'inicio';
function go(token) {
  const anchor = token === 'cursos' || token === 'como';
  current = anchor ? 'inicio' : token;
  try { history.pushState(null, '', '#' + token); } catch (e) {}
  render(anchor ? token : undefined);
}
function fromHash() {
  const h = (location.hash || '').slice(1);
  const anchor = h === 'cursos' || h === 'como';
  current = anchor ? 'inicio' : (h || 'inicio');
  render(anchor ? h : undefined);
}
window.addEventListener('popstate', fromHash);

document.addEventListener('click', e => {
  const link = e.target.closest('[data-go]');
  if (link) { e.preventDefault(); go(link.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, v } = el.dataset;
  if (act === 'filter') { filter = v; render(false); }
  if (act === 'method') { payMethod = v; render(false); }
  if (act === 'login') {
    state.user = true; const next = state.pendingCourse; state.pendingCourse = null; save();
    go(next ? 'pagar-' + next : 'biblioteca');
  }
  if (act === 'logout') { state.user = false; save(); go('inicio'); }
  if (act === 'reset') { state = blank(); fresh = null; save(); go('inicio'); toast('Demonstração reiniciada.'); }
  if (act === 'pay' && !paying) {
    paying = true;
    const c = byId(v), st = $('pay-status');
    el.disabled = true; el.textContent = 'Aguardando a confirmação do banco…';
    setTimeout(() => {
      st.textContent = 'Pagamento confirmado'; st.classList.add('paid');
      el.textContent = 'Liberando o PDF…';
    }, 900);
    setTimeout(() => {
      paying = false;
      state.owned.unshift(c.id);
      state.sales.unshift({ id: c.id, who: STUDENT.name, course: c.short, when: 'Agora', value: c.price });
      fresh = c.id; save(); go('biblioteca');
      toast('Pagamento confirmado. Seu PDF já está liberado.');
    }, 1900);
  }
  if (act === 'open') openPdf(byId(v));
  if (act === 'close') $('pdf').close();
  if (act === 'fakedownload') { $('pdf').close(); toast('Na versão final, este botão baixa o PDF com a marca d\'água do comprador.'); }
  if (act === 'newcourse') toast('Na versão final, aqui o pastor envia o PDF, define título e preço e publica o curso.');
});

fromHash();
</script>
</body>
</html>
